name: CN - Build play image

# Build the WorkAdventure `play` image from this fork and push it to GHCR
# under the CONCEPT-NATION namespace. Triggered automatically on push to
# `v1.27.*-cn-*` branches, or manually via the Actions UI.

on:
  push:
    branches:
      - "v1.27.*-cn-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.27.7-cn-jitsi-1)"
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # On push events, derive a stable tag from the branch name:
            #   refs/heads/v1.27.7-cn-jitsi -> v1.27.7-cn-jitsi-1
            # Run number gives uniqueness if the same branch is pushed multiple times.
            echo "value=${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push play image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: play/Dockerfile
          push: true
          # No Sentry secrets passed → vite.config.ts disables the Sentry plugin.
          tags: |
            ghcr.io/concept-nation/workadventure-play:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FAST_BUILD=
